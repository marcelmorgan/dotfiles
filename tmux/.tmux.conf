# tmux 3.5+ config

# ── Prefix ────────────────────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── General ───────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 10000
set -sg escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g focus-events on

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 140

# Catppuccin Mocha palette
# bg=#1e1e2e  surface=#313244  subtext=#6c7086  text=#cdd6f4
# blue=#89b4fa  green=#a6e3a1  yellow=#f9e2af

set -g status-style                 "bg=#1e1e2e,fg=#cdd6f4"

# Left: session name pill
set -g status-left \
  "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa,nobold]▌ "

# Right: git branch (when in a repo) │ dirname │ time
set -g status-right \
  "#[fg=#a6e3a1]#(cd #{pane_current_path} && git branch --show-current 2>/dev/null | sed 's/.*/  & /')#[fg=#6c7086]│ #[fg=#cdd6f4]#{b:pane_current_path} #[fg=#6c7086]│ #[fg=#cdd6f4]%H:%M "

# ── Windows ───────────────────────────────────────────────────────────────────
setw -g window-status-style         "fg=#6c7086,bg=#1e1e2e"
setw -g window-status-format        " #I #W "
setw -g window-status-current-style "fg=#89b4fa,bg=#313244,bold"
setw -g window-status-current-format " #I #W "

# ── Panes ─────────────────────────────────────────────────────────────────────
set -g pane-border-style            "fg=#313244"
set -g pane-active-border-style     "fg=#89b4fa"

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style                "bg=#313244,fg=#cdd6f4"
set -g message-command-style        "bg=#313244,fg=#f9e2af"

# ── Clock ─────────────────────────────────────────────────────────────────────
setw -g clock-mode-colour           "#89b4fa"
